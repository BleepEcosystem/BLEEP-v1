name: CI

on:
  push:
    branches: ["main", "dev", "release/*"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  RUST_BACKTRACE: 1
  LIBCLANG_PATH: /usr/lib/llvm-14/lib

jobs:
  stub-verifier-gate:
    name: Stub verifier gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject proof-verification stubs and placeholder keys
        run: bash scripts/check_no_stub_verifiers.sh

      - name: Reject skipped zeroization fields
        run: |
          if grep -rn --include='*.rs' 'zeroize(skip)' crates/; then
            echo "FATAL: zeroize(skip) neutralizes ZeroizeOnDrop" >&2
            exit 1
          fi

  # ------------------------------------------------------------------ #
  #  1. FORMAT CHECK                                                     #
  # ------------------------------------------------------------------ #
  fmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------ #
  #  2. CLIPPY LINTS                                                     #
  # ------------------------------------------------------------------ #
  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            protobuf-compiler libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache cargo registry + build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-
            ${{ runner.os }}-

      - name: Run Clippy (all crates, all features)
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # ------------------------------------------------------------------ #
  #  3. BUILD (debug + release)                                          #
  # ------------------------------------------------------------------ #
  build:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-22.04
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            protobuf-compiler libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-build-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.profile }}-
            ${{ runner.os }}-

      - name: Build (debug)
        if: matrix.profile == 'debug'
        run: cargo build --locked --workspace --all-features --jobs 1

      - name: Build (release)
        if: matrix.profile == 'release'
        run: cargo build --locked --workspace --all-features --release --jobs 1

      - name: Upload release binary
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: bleep-linux-amd64
          path: |
            target/release/bleep
            target/release/bleep_admin
            target/release/bleep-executor
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  4. TEST SUITE                                                       #
  # ------------------------------------------------------------------ #
  test:
    name: Workspace Tests
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            protobuf-compiler libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-
            ${{ runner.os }}-

      - name: Test workspace against Cargo.lock
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features --jobs 1 -- --nocapture \
            2>&1 | tee test-results.txt

      - name: Smoke test genesis administrator authentication and transaction submission
        run: cargo test --locked -p bleep-rpc tests_sprint8::bootstrap_admin_auth_smoke -- --exact

      - name: Smoke test PBFT rejection and replacement
        run: cargo run --locked -p bleep-consensus --example e2e_tx

      - name: Test three-validator state roots across five epochs
        run: cargo test --locked -p bleep-root --bin bleep committed_block_tests -- --nocapture

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: test-results
          path: test-results.txt
          retention-days: 14

  # ------------------------------------------------------------------ #
  #  5. WORKSPACE-WIDE INTEGRATION TESTS                                 #
  # ------------------------------------------------------------------ #
  integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            protobuf-compiler libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-integration-

      - name: Run workspace integration tests
        run: |
          cargo test --locked \
            --workspace \
            --tests \
            --all-features \
            --jobs 1 \
            -- \
            --nocapture

  # ------------------------------------------------------------------ #
  #  6. SECURITY AUDIT                                                   #
  # ------------------------------------------------------------------ #
  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policy
        run: cargo deny --config .github-deny.toml check all

  # ------------------------------------------------------------------ #
  #  7. DEPENDENCY REVIEW (on PRs)                                       #
  # ------------------------------------------------------------------ #
  dep-review:
    name: Dependency Review
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # ------------------------------------------------------------------ #
  #  8. CONSTITUTIONAL INVARIANT CHECK                                   #
  # ------------------------------------------------------------------ #
  invariants:
    name: Constitutional Invariants
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            protobuf-compiler libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-invariants-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify MAX_SUPPLY const-assertion compiles
        run: |
          cargo build --locked -p bleep-economics --all-features
          echo "✅ Constitutional supply cap invariant: PASS"

      - name: Verify MAX_INFLATION_RATE_BPS const-assertion compiles
        run: |
          cargo build --locked -p bleep-governance --all-features
          echo "✅ Constitutional inflation cap invariant: PASS"

      - name: Verify fee burn split sums to 10,000 bps
        run: |
          cargo test --locked -p bleep-economics --all-features -- fee_split 2>&1 | \
            grep -E "(PASSED|test result: ok)" && \
            echo "✅ Fee burn split invariant: PASS" || \
            (echo "❌ Fee burn split invariant: FAIL" && exit 1)

  # ------------------------------------------------------------------ #
  #  9. POST-QUANTUM CRYPTOGRAPHY SMOKE TEST                             #
  # ------------------------------------------------------------------ #
  pq-smoke:
    name: PQ Cryptography Smoke Test
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-pq-smoke-${{ hashFiles('**/Cargo.lock') }}

      - name: Run bleep-crypto tests (SPHINCS+ / ML-KEM)
        run: |
          cargo test --locked -p bleep-crypto --all-features -- --nocapture 2>&1 | \
            tee pq-smoke-results.txt
          echo "✅ SPHINCS+-SHAKE-256f-simple: tested"
          echo "✅ ML-KEM-1024: tested"

      - name: Run bleep-zkp tests (Winterfell STARK)
        run: |
          cargo test --locked -p bleep-zkp --all-features -- --nocapture 2>&1 | \
            tee -a pq-smoke-results.txt
          echo "✅ Winterfell STARK proof system: tested"

      - name: Upload PQ smoke results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: pq-smoke-results
          path: pq-smoke-results.txt
          retention-days: 14

  # ------------------------------------------------------------------ #
  # 10. CI SUMMARY GATE                                                  #
  # ------------------------------------------------------------------ #
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-22.04
    needs:
      - fmt
      - clippy
      - build
      - test
      - integration
      - audit
      - dep-review
      - invariants
      - stub-verifier-gate
      - pq-smoke
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('❌ Failed jobs:', failed)
              sys.exit(1)
          print('✅ All CI jobs passed')
          "
