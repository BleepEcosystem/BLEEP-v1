name: Security

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ------------------------------------------------------------------ #
  #  cargo-audit — known CVEs in dependencies                            #
  # ------------------------------------------------------------------ #
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run audit
        run: cargo audit --deny warnings --json > audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30

  # ------------------------------------------------------------------ #
  #  cargo-deny — license + duplicate + banned crate check               #
  # ------------------------------------------------------------------ #
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run deny checks
        run: cargo deny --config .github-deny.toml check all

  # ------------------------------------------------------------------ #
  #  cargo-fuzz — adversarial input coverage for critical parsing paths    #
  # ------------------------------------------------------------------ #
  fuzz:
    name: Fuzz critical inputs
    runs-on: ubuntu-22.04
    needs: [cargo-audit, cargo-deny]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --component rustfmt --profile minimal
          cargo +nightly install cargo-fuzz --locked

      - name: Fuzz P2P message parsing
        working-directory: crates/bleep-p2p
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-fuzz-target
        run: cargo +nightly fuzz run fuzz_secure_message_deserialize -- -max_total_time=30

      - name: Fuzz block deserialization
        working-directory: crates/bleep-core
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-fuzz-target
        run: cargo +nightly fuzz run fuzz_block_deserialize -- -max_total_time=30

      - name: Fuzz RPC request parsing
        working-directory: crates/bleep-rpc
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-fuzz-target
        run: cargo +nightly fuzz run fuzz_rpc_parsers -- -max_total_time=30

  # ------------------------------------------------------------------ #
  #  CodeQL — static analysis for Rust                                   #
  # ------------------------------------------------------------------ #
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            protobuf-compiler libssl-dev pkg-config

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-and-quality

      - name: Build for CodeQL
        run: cargo build --workspace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  # ------------------------------------------------------------------ #
  #  Supply chain — verify Cargo.lock is committed and not manipulated   #
  # ------------------------------------------------------------------ #
  supply-chain:
    name: Supply Chain Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.lock is committed
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "❌ Cargo.lock is missing — supply chain verification requires it"
            exit 1
          fi
          echo "✅ Cargo.lock present"

      - name: Check for dependency updates (informational)
        run: |
          cargo install cargo-outdated --locked 2>/dev/null || true
          cargo outdated --workspace || true
