[package]
name = "bleep-core-fuzz"
version = "0.0.1"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bleep-core = { path = ".." }
bincode = { version = "2.0.1", features = ["serde"] }
serde_json = "1.0"

[[bin]]
name = "fuzz_block_deserialize"
path = "fuzz_targets/fuzz_block_deserialize.rs"
test = false
doc = false
